
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Frases</title>

    <!-- Conexão com CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Gerador de Frases</h1>

        <p>Clique no botão e descubra uma nova frase!</p>

        <div class="caixa-frase">

            <h2 id="textoFrase">
                Sua frase aparecerá aqui!
            </h2>

        </div>

        <button onclick="gerarFrase()">
            Gerar Nova Frase
        </button>

    </div>

    <!-- Conexão com JavaScript -->
    <script src="script.js"></script>

</body>
</html>
